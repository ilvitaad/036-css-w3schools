<!--Selector de [atributo] -->
<!-- se utiliza para seleccionar elementos con el atributo especificado-->
<!DOCTYPE html>
<html>
<head>
<style>
a[target] {
  background-color: yellow;
}
</style>
</head>
<body>

<h2>CSS [attribute] Selector</h2>

<p>Select and style the links with a target attribute:</p>

<a href="https://www.w3schools.com" target="_blank">W3schools.com</a>
<a href="https://www.w3schools.com/css/">CSS</a>
<a href="https://www.w3schools.com/html/" target="_blank">HTML</a>

</body>
</html>

<!--Selector CSS [atributo="valor"]-->
<!--selector se utiliza para seleccionar elementos con un atributo específico y un valor exacto-->
<style>
a[target=_blank] {
  background-color: yellow;
}
</style>

<!--Selector CSS [atributo~="valor"]-->
<!--se utiliza para seleccionar elementos cuyo valor de atributo contenga una palabra específica.-->
<style>
[title~="flower"] {
  border: 5px solid yellow;
}
</style>

<!--Selector CSS [atributo|="valor"]-->
<!-- se utiliza para seleccionar elementos con el atributo específico-->
<style>
[class|=top] {
  background: yellow;
}
</style>

<!--Selectores de atributos avanzados-->
<!--Selector CSS [atributo^="valor"]-->
<style>
[class^="top"] {
  background: yellow;
}
</style>

<!--Selector CSS [atributo$="valor"]-->
<style> 
[class$="test"] {
  background: yellow;
}
</style>

<!--Selector CSS [atributo*="valor"]-->
<!--se utiliza para seleccionar elementos cuyo valor de atributo contiene un valor específico.-->
<style> 
[class*="te"] {
  background: yellow;
}
</style>
<div class="first_test">The first div element.</div>
<div class="second">The second div element.</div>
<div class="my-test">The third div element.</div>
<p class="mytest">This is some text in a paragraph.</p>
