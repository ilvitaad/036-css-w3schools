<!--opacity especifica la opacidad/transparencia de un elemento.-->
<!DOCTYPE html>
<html>
<head>
<style>
img {
  opacity: 0.5; /*50% de opacidad*/
}
</style>
</head>
<body>

<h2>The opacity Property</h2>

<p>The opacity property specifies the opacity of an element. The lower the value, the more transparent:</p>

<p>Image with 50% opacity:</p>
<img src="img_forest.jpg" alt="Forest" width="170" height="100">

</body>
</html>

<!--Opacidad y :hover-->
<!--opacitypropiedad se usa a menudo para cambiar la opacidad al pasar el ratón por encima: :hover-->
<style>
img {
  opacity: 0.5;
}

img:hover {
  opacity: 1.0;
}
</style>

<!--Cajas transparentes-->
<!-- agregar transparencia al fondo de un elemento-->
<style>
div {
  background-color: green;
  padding: 10px;
}

div.first {
  opacity: 0.1;
}

div.second {
  opacity: 0.3;
}

div.third {
  opacity: 0.6;
}
</style>

<!--Texto en cuadro transparente-->
<html>
<head>
<style>
div.background {
  background: url(klematis.jpg) repeat;
  border: 2px solid black;
}

div.transbox {
  margin: 30px;
  background-color: rgba(255, 255, 255, 0.6);
  border: 1px solid black;
}

div.transbox p {
  margin: 5%;
  font-weight: bold;
  color: #000000;
}
</style>
</head>
<body>

<div class="background">
  <div class="transbox">
    <p>This is some text that is placed in the transparent box.</p>
  </div>
</div>

</body>
</html>
