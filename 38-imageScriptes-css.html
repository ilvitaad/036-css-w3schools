<!--width- heightDefine el ancho y la altura de cada parte de la imagen.
background-image: url(img_navsprites.gif);- Define la URL del sprite de la imagen
background-position- Desplaza la imagen de fondo dentro de cada elemento para mostrar solo la porción deseada de la imagen del sprite.
<img id="home" src="img_trans.gif">- Cada imagen comienza con una pequeña imagen transparente porque el atributo src no puede estar vacío (la imagen mostrada será la imagen de fondo que especifiquemos en CSS).
-->
<!DOCTYPE html>
<html>
<head>
<style>
#home {
  width: 46px;
  height: 44px;
  background-image: url(img_navsprites.gif);
  background-position: 0 0;
}

#prev {
  width: 43px;
  height: 44px;  
  background-image: url('img_navsprites.gif');
  background-position: -47px 0;  
}

#next {
  width: 43px;
  height: 44px;  
  background-image: url('img_navsprites.gif');
  background-position: -91px 0;  
}
</style>
</head>
<body>

<h2>Image Sprites</h2>

<img id="home" src="img_trans.gif" width="1" height="1">
<img id="prev" src="img_trans.gif" width="1" height="1">
<img id="next" src="img_trans.gif" width="1" height="1">

</body>
</html>

<!--Sprites de imágenes en una lista de navegación-->
<!DOCTYPE html>
<html>
<head>
<style>
#navlist {
  position: relative;
}

#navlist li {
  margin: 0;
  padding: 0;
  list-style: none;
  position: absolute;
  top: 0;
}

#navlist li, #navlist a {
  height: 44px;
  display: block;
}

#home {
  left: 0px;
  width: 46px;
  background: url('img_navsprites.gif') 0 0;
}

#prev {
  left: 60px;
  width: 43px;
  background: url('img_navsprites.gif') -47px 0;
}

#next {
  left: 120px;
  width: 43px;
  background: url('img_navsprites.gif') -91px 0;
}
</style>
</head>
<body>

<h2>Image Sprites - Navigation List</h2>

<ul id="navlist">
  <li id="home"><a href="#"></a></li>
  <li id="prev"><a href="#"></a></li>
  <li id="next"><a href="#"></a></li>
</ul>

</body>
</html>

<!--Sprites de imagen - Efecto de desplazamiento-->
#home a:hover {
  background: url('img_navsprites_hover.gif') 0 -45px;
}

#prev a:hover {
  background: url('img_navsprites_hover.gif') -47px -45px;
}

#next a:hover {
  background: url('img_navsprites_hover.gif') -91px -45px;
}
