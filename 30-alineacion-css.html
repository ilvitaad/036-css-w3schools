<!--alineacion al centro-->
<!DOCTYPE html>
<html>
<head>
<style>
.center {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 200px;
  border: 3px solid green; 
}
</style>
</head>
<body>

<h2>Centering with Flexbox</h2>

<p>A flex container with both the justify-content and the align-items properties set to center, will align the item(s) in the center (in both axis).</p>

<div class="center">
  <p>I am vertically and horizontally centered.</p>
</div>

</body>
</html>

<!--alineacion centrado horizontal-->
.center {
  margin: auto;
  width: 50%;
  border: 3px solid green;
  padding: 10px;
}

<!--Centrar Alinear una imagen-->
<style>
img {
  display: block;
  margin-left: auto;
  margin-right: auto;
}
</style>
