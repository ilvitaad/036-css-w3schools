<!DOCTYPE html>
<html>
<head>
<style>
.container {
  position: relative;
}

.topleft { /*arriba derecha*/
  position: absolute;
  top: 8px;
  left: 16px;
  font-size: 20px;
}

.topright { /*arriba derecha*/
  position: absolute;
  top: 8px;
  right: 16px;
  font-size: 20px;
}

.bottomleft { /*abajo derecha*/
  position: absolute;
  bottom: 8px;
  left: 16px;
  font-size: 20px;
}

.bottomright { /*abajo derecha*/
  position: absolute;
  bottom: 8px;
  right: 16px;
  font-size: 20px;
}

.center { /*centrado*/
  position: absolute;
  top: 50%;
  width: 100%;
  text-align: center;
  font-size: 20px;
}

img { 
  width: 100%;
  height: auto;
  opacity: 0.5;
}
</style>
</head>
<body>

<h2>Position Text on Image</h2>

<p>Position a text on an image in the top left corner:</p>

<div class="container">
<img src="img_5terre_wide.jpg" alt="Cinque Terre" width="1000" height="300">
<div class="topleft">Top Left</div>
<div class="topright">Top Right</div>
<div class="bottomleft">Bottom Left</div>
<div class="bottomright">Bottom Right</div>
<div class="center">Centered</div>
</div>

</body>
</html>
